<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Third Industries</title>
  <meta name="description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <link rel="canonical" href="https://third.industries/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://third.industries/">
  <meta property="og:title" content="Third Industries">
  <meta property="og:description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <meta property="og:site_name" content="Third Industries">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Third Industries">
  <meta name="twitter:description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Third Industries LLC",
    "url": "https://third.industries",
    "description": "Products, services, and operations by Peter Salvato.",
    "founder": {
      "@type": "Person",
      "@id": "https://petersalvato.com/#peter-salvato",
      "name": "Peter Salvato",
      "url": "https://petersalvato.com"
    },
    "email": "peter@third.industries"
  }
  </script>
  <style>
    @font-face {
      font-family: 'Calder Dark';
      src: url('Calder Dark.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Calder Dark Grit';
      src: url('Calder Dark Grit.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e4e4e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 2rem;
    }

    .page {
      max-width: 800px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header img {
      max-width: 200px;
      width: 100%;
      height: auto;
      filter: invert(1);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-bottom: 3rem;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #111;
      overflow: hidden;
      transition: background 0.15s ease;
    }

    .card:hover {
      background: #1a1a1a;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 1200/630;
      overflow: hidden;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.45) saturate(0.7);
      transition: filter 0.15s ease;
    }

    .card:hover .card-image img {
      filter: brightness(0.55) saturate(0.8);
    }


    .card-info {
      padding: 1rem;
    }

    .card-name {
      font-family: 'Calder Dark', monospace;
      font-size: 0.95rem;
      color: #e4e4e8;
      margin-bottom: 0.25rem;
    }

    .card-desc {
      font-family: 'Calder Dark Grit', 'Calder Dark', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #63636e;
    }

    .footer {
      text-align: center;
    }

    .footer-line {
      font-size: 0.85rem;
      color: #63636e;
      margin-bottom: 0.5rem;
    }

    .footer-line a {
      color: #b4b4be;
      text-decoration: none;
      border-bottom: 1px solid #3f3f46;
    }

    .footer-line a:hover {
      color: #e4e4e8;
      border-color: #e4e4e8;
    }

    .contact {
      font-family: 'Calder Dark Grit', 'Calder Dark', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
    }

    .contact a {
      color: #63636e;
      text-decoration: none;
      border-bottom: 1px solid #2a2a2f;
    }

    .contact a:hover {
      color: #b4b4be;
      border-color: #b4b4be;
    }

    @media (max-width: 600px) {
      body { padding: 2rem 1rem; }
      .cards { grid-template-columns: 1fr; gap: 1px; }
      .header img { max-width: 160px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <img src="Asset 2@2x.png" alt="Third Industries">
    </div>

    <div class="cards">
      <a class="card" href="https://petersalvato.com">
        <div class="card-image">
          <img src="og-petersalvato.png" alt="Peter Salvato">
        </div>
        <div class="card-info">
          <div class="card-name">Peter Salvato</div>
          <div class="card-desc">The practice</div>
        </div>
      </a>
      <a class="card" href="https://joineryschool.com">
        <div class="card-image">
          <img src="og-joinery.png" alt="Joinery">
        </div>
        <div class="card-info">
          <div class="card-name">Joinery</div>
          <div class="card-desc">The school</div>
        </div>
      </a>
      <a class="card" href="https://journeymanshow.com">
        <div class="card-image">
          <img src="og-journeyman.png" alt="Journeyman">
        </div>
        <div class="card-info">
          <div class="card-name">Journeyman</div>
          <div class="card-desc">The show</div>
        </div>
      </a>
    </div>

    <div class="footer">
      <p class="footer-line">By <a href="https://petersalvato.com">Peter Salvato</a></p>
      <p class="contact"><a href="mailto:peter@third.industries">peter@third.industries</a></p>
    </div>
  </div>
</body>
</html>
