<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Third Industries</title>
  <meta name="description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <link rel="canonical" href="https://third.industries/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://third.industries/">
  <meta property="og:title" content="Third Industries">
  <meta property="og:description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <meta property="og:site_name" content="Third Industries">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Third Industries">
  <meta name="twitter:description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Third Industries LLC",
    "url": "https://third.industries",
    "description": "Products, services, and operations by Peter Salvato.",
    "founder": {
      "@type": "Person",
      "@id": "https://petersalvato.com/#peter-salvato",
      "name": "Peter Salvato",
      "url": "https://petersalvato.com"
    },
    "email": "peter@third.industries"
  }
  </script>
  <style>
    @font-face {
      font-family: 'Calder Dark';
      src: url('Calder Dark.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Calder Dark Grit';
      src: url('Calder Dark Grit.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #141416;
      color: #e4e4e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 2rem;
    }

    .page {
      max-width: 800px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header img {
      max-width: 180px;
      width: 100%;
      height: auto;
      filter: invert(1);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .25rem;
      background: transparent;
      margin-bottom: 2.5rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      background: #1b1b1b;
      padding: 2.5rem 1.5rem;
      transition: background 0.15s ease;
    }

    .card:hover {
      background: #232323;
    }

    .card-mark {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .card-mark img {
      max-height: 64px;
      max-width: 80px;
      width: auto;
      filter: invert(1);
    }

    .card-name {
      font-family: 'Calder Dark', monospace;
      font-size: 1rem;
      color: #e4e4e8;
      margin-bottom: 0.35rem;
      text-align: center;
    }

    .card-desc {
      font-family: 'Calder Dark Grit', 'Calder Dark', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #63636e;
      text-align: center;
    }

    .card-url {
      font-size: 0.75rem;
      color: #2a2a2f;
      margin-top: 0.75rem;
      letter-spacing: 0.02em;
    }

    .card:hover .card-url {
      color: #63636e;
    }

    .footer {
      text-align: center;
    }

    .footer-line {
      font-size: 0.85rem;
      color: #63636e;
      margin-bottom: 0.5rem;
    }

    .footer-line a {
      color: #b4b4be;
      text-decoration: none;
      border-bottom: 1px solid #2a2a2f;
    }

    .footer-line a:hover {
      color: #e4e4e8;
      border-color: #e4e4e8;
    }

    .contact {
      font-family: 'Calder Dark Grit', 'Calder Dark', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
    }

    .contact a {
      color: #63636e;
      text-decoration: none;
      border-bottom: 1px solid #2a2a2f;
    }

    .contact a:hover {
      color: #b4b4be;
      border-color: #b4b4be;
    }

    @media (max-width: 600px) {
      body { padding: 2rem 1rem; }
      .cards { grid-template-columns: 1fr; }
      .header img { max-width: 140px; }
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <img src="Asset 2@2x.png" alt="Third Industries">
    </div>

    <div class="cards">
      <a class="card" target="_blank" rel="noopener" href="https://petersalvato.com">
        <div class="card-mark">
          <img src="mark-ps.png" alt="Peter Salvato mark">
        </div>
        <div class="card-name">Peter Salvato</div>
        <div class="card-desc">The practice</div>
        <div class="card-url">petersalvato.com</div>
      </a>
      <a class="card" target="_blank" rel="noopener" href="https://joineryschool.com">
        <div class="card-mark">
          <img src="mark-joinery.svg" alt="Joinery mark">
        </div>
        <div class="card-name">Joinery</div>
        <div class="card-desc">The school</div>
        <div class="card-url">joineryschool.com</div>
      </a>
      <a class="card" target="_blank" rel="noopener" href="https://journeymanshow.com">
        <div class="card-mark">
          <img src="mark-journeyman.png" alt="Journeyman mark">
        </div>
        <div class="card-name">Journeyman</div>
        <div class="card-desc">The show</div>
        <div class="card-url">journeymanshow.com</div>
      </a>
    </div>

    <div class="footer">
      <p class="footer-line">By <a href="https://petersalvato.com">Peter Salvato</a></p>
      <p class="contact"><a href="mailto:peter@third.industries">peter@third.industries</a></p>
    </div>
  </div>
</body>
</html>
