<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Third Industries</title>
  <meta name="description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <link rel="canonical" href="https://third.industries/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://third.industries/">
  <meta property="og:title" content="Third Industries">
  <meta property="og:description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <meta property="og:site_name" content="Third Industries">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Third Industries">
  <meta name="twitter:description" content="Third Industries LLC. Products, services, and operations by Peter Salvato.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Third Industries LLC",
    "url": "https://third.industries",
    "description": "Products, services, and operations by Peter Salvato.",
    "founder": {
      "@type": "Person",
      "@id": "https://petersalvato.com/#peter-salvato",
      "name": "Peter Salvato",
      "url": "https://petersalvato.com"
    },
    "email": "peter@third.industries"
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e4e4e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .page {
      max-width: 480px;
      width: 100%;
    }

    .mark {
      margin-bottom: 3rem;
      text-align: center;
    }

    .mark img {
      max-width: 240px;
      width: 100%;
      height: auto;
      filter: invert(1);
    }

    .rule {
      border: none;
      border-top: 1px solid #2a2a2f;
      margin: 0 0 2rem 0;
    }

    .catalog {
      list-style: none;
      margin-bottom: 2.5rem;
    }

    .catalog li {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #63636e;
      padding: 0.6rem 0;
      border-bottom: 1px solid #1e1e22;
    }

    .catalog li:first-child {
      border-top: 1px solid #1e1e22;
    }

    .footer-line {
      font-size: 0.85rem;
      color: #63636e;
      margin-bottom: 0.75rem;
    }

    .footer-line a {
      color: #b4b4be;
      text-decoration: none;
      border-bottom: 1px solid #3f3f46;
    }

    .footer-line a:hover {
      color: #e4e4e8;
      border-color: #e4e4e8;
    }

    .contact {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .contact a {
      color: #63636e;
      text-decoration: none;
      border-bottom: 1px solid #2a2a2f;
    }

    .contact a:hover {
      color: #b4b4be;
      border-color: #b4b4be;
    }

    @media (max-width: 480px) {
      body { padding: 2rem 1.5rem; }
      .mark img { max-width: 200px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="mark">
      <img src="Asset 2@2x.png" alt="Third Industries">
    </div>
    <hr class="rule">
    <ul class="catalog">
      <li>Books</li>
      <li>Prints</li>
      <li>Music</li>
      <li>Artifacts</li>
    </ul>
    <p class="footer-line">By <a href="https://petersalvato.com">Peter Salvato</a></p>
    <p class="contact"><a href="mailto:peter@third.industries">peter@third.industries</a></p>
  </div>
</body>
</html>
